<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deadlock Lab</title>
<style>
  :root{--bg:#071326;--surface:#0d213d;--line:#27476d;--text:#ecf5ff;--muted:#8ea7c5;--cyan:#4cdfff;--blue:#7890ff;--green:#5ee6a8;--amber:#ffc857;--red:#ff6d86}
  *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:14px/1.4 Inter,system-ui,sans-serif}
  .app{width:min(1120px,calc(100% - 28px));margin:0 auto;padding:24px 0 34px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:17px}.title{display:flex;align-items:center;gap:12px}.mark{width:38px;height:38px;border:2px solid var(--cyan);border-radius:12px;display:grid;place-items:center;box-shadow:0 0 28px #4cdfff33}.mark i{width:15px;height:15px;border:3px solid var(--cyan);border-radius:50%;display:block;position:relative}.mark i:after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:var(--amber);right:-6px;top:-4px}.kicker{font-size:10px;letter-spacing:.18em;color:var(--cyan);font-weight:800;text-transform:uppercase}.top h1{font-size:26px;line-height:1.1;margin:3px 0 0;letter-spacing:-.04em}.live{font-size:11px;color:var(--green);font-weight:800;letter-spacing:.12em;text-transform:uppercase}.live:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:7px;box-shadow:0 0 0 5px #5ee6a814}
  .controls{display:flex;align-items:center;flex-wrap:wrap;gap:9px;padding:11px 13px;border:1px solid var(--line);border-radius:13px;background:#0b1c35;margin-bottom:12px}.controls label{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.12em;text-transform:uppercase}.controls select,.controls button{font:inherit;color:var(--text);background:#091a31;border:1px solid #31527a;border-radius:8px;padding:8px 11px}.controls select{cursor:pointer}.controls button{cursor:pointer}.controls button:hover{border-color:var(--cyan)}.controls .primary{background:#237da3;border-color:#63ddff;font-weight:800}.controls .spacer{flex:1}.controls input{accent-color:var(--cyan);width:90px}.readout{color:var(--muted);font-variant-numeric:tabular-nums;min-width:68px;text-align:right}
  .stage{border:1px solid var(--line);border-radius:16px;padding:7px;background:#091a32;box-shadow:0 20px 60px #00000033}.stage canvas{display:block;width:100%;height:auto;border-radius:10px}.hint{text-align:center;color:var(--muted);font-size:11px;margin-top:12px}.hint b{color:var(--cyan)}
  @media(max-width:650px){.app{width:min(100% - 16px,1120px);padding-top:15px}.top h1{font-size:21px}.live{display:none}.controls{gap:7px}.controls .spacer{display:none}.readout{margin-left:auto}.stage{padding:4px}}
</style>
</head>
<body>
<main class="app">
  <header class="top"><div class="title"><div class="mark"><i></i></div><div><div class="kicker">Operating systems · animation</div><h1>Deadlock Lab</h1></div></div><div class="live">simulation online</div></header>
  <section class="controls" aria-label="Simulation controls">
    <label for="scenario">Scenario</label><select id="scenario"><option value="0">Textbook safe state</option><option value="1">Light load</option><option value="2">Deadlock-prone</option><option value="3">Circular wait</option></select>
    <button id="play" class="primary" type="button">▶ Play</button><button id="step" type="button" aria-label="Step forward">⏭ Step</button><button id="reset" type="button">↺ Reset</button>
    <span class="spacer"></span><label for="speed">Speed</label><input id="speed" type="range" min="0.5" max="2.5" step="0.5" value="1"><span id="speedText" class="readout">1×</span><span id="steps" class="readout">0 / 3</span>
  </section>
  <section class="stage"><canvas id="canvas" width="1100" height="600" role="img" aria-label="Animated resource allocation and deadlock simulator"></canvas></section>
  <p class="hint"><b>Play</b> the queue or use <b>Step</b> to watch each request travel through both algorithms.</p>
</main>
<script>
'use strict';
const scenarios=[
 {name:'Textbook safe state',available:[3,3,2],max:[[7,5,3],[3,2,2],[9,0,2],[2,2,2],[4,3,3]],allocation:[[0,1,0],[2,0,0],[3,0,2],[2,1,1],[0,0,2]],requests:[{pid:1,vec:[1,0,2]},{pid:4,vec:[3,3,0]},{pid:0,vec:[0,2,0]}]},
 {name:'Light load',available:[4,3],max:[[3,2],[2,2],[2,1]],allocation:[[0,0],[0,0],[0,0]],requests:[{pid:0,vec:[3,2]},{pid:1,vec:[2,2]},{pid:2,vec:[2,1]}]},
 {name:'Deadlock-prone',available:[2],max:[[2],[2],[2]],allocation:[[0],[0],[0]],requests:[{pid:0,vec:[1]},{pid:1,vec:[1]},{pid:0,vec:[1]},{pid:1,vec:[1]}]},
 {name:'Circular wait',available:[0,0],max:[[2,2],[2,2]],allocation:[[1,0],[0,1]],requests:[{pid:0,vec:[0,1]},{pid:1,vec:[1,0]}]}
];
const $=id=>document.getElementById(id), canvas=$('canvas'), ctx=canvas.getContext('2d');
const C={bg:'#091a32',surface:'#102a4a',line:'#315477',text:'#ecf5ff',muted:'#8ea7c5',cyan:'#4cdfff',blue:'#7890ff',green:'#5ee6a8',amber:'#ffc857',red:'#ff6d86'};
let scenarioIndex=0,playing=false,speed=1,last=0,clock=0,carry=0,state;
const copy=v=>JSON.parse(JSON.stringify(v)), add=(a,b)=>a.map((n,i)=>n+b[i]), sub=(a,b)=>a.map((n,i)=>n-b[i]), leq=(a,b)=>a.every((n,i)=>n<=b[i]);
function run(kind,d){return{kind,available:copy(d.available),max:copy(d.max),allocation:copy(d.allocation),dead:[],done:Array(d.max.length).fill(false),waiting:Array(d.max.length).fill(false),waitingReq:Array(d.max.length).fill(null),results:[]};}
function safe(s){const work=copy(s.available),finish=s.allocation.map(a=>a.every(n=>n===0));let again=true;while(again){again=false;for(let i=0;i<s.max.length;i++)if(!finish[i]&&leq(sub(s.max[i],s.allocation[i]),work)){work.splice(0,work.length,...add(work,s.allocation[i]));finish[i]=true;again=true;}}return finish.every(Boolean);}
function scan(s){const work=copy(s.available),finish=s.allocation.map(a=>a.every(n=>n===0));let again=true;while(again){again=false;for(let i=0;i<s.max.length;i++)if(!finish[i]){const req=s.waiting[i]?s.waitingReq[i]:s.max[i].map(()=>0);if(leq(req,work)){work.splice(0,work.length,...add(work,s.allocation[i]));finish[i]=true;again=true;}}}return finish.map((ok,i)=>ok?-1:i).filter(i=>i>=0);}
function take(run,req,index){const pid=req.pid,vec=req.vec,need=sub(run.max[pid],run.allocation[pid]),out={pid,req:vec,status:'held',title:'HELD',detail:''};if(!leq(vec,need)){out.title='INVALID';out.detail='over declared need';run.results.push(out);return out}if(!leq(vec,run.available)){out.title='WAITING';out.status='waiting';out.detail='not enough available work';if(run.kind==='detect'){run.waiting[pid]=true;run.waitingReq[pid]=copy(vec);run.dead=scan(run);if(run.dead.length){out.status='dead';out.title='DEADLOCK';out.detail=run.dead.map(i=>'P'+i).join(', ')+' cannot finish'}}run.results.push(out);return out}if(run.kind==='banker'){const trial={available:sub(run.available,vec),max:run.max,allocation:copy(run.allocation)};trial.allocation[pid]=add(trial.allocation[pid],vec);if(!safe(trial)){out.detail='future state would be unsafe';run.results.push(out);return out}}run.available=sub(run.available,vec);run.allocation[pid]=add(run.allocation[pid],vec);if(run.kind==='detect')run.waiting[pid]=false;out.status='granted';out.title='GRANTED';out.detail=run.kind==='banker'?'safe sequence found':'granted, then scanned';if(run.kind==='detect')run.dead=scan(run);if(run.dead.length){out.status='dead';out.title='DEADLOCK';out.detail=run.dead.map(i=>'P'+i).join(', ')+' cannot finish'}for(let i=0;i<run.max.length;i++)if(!run.done[i]&&run.max[i].every((n,j)=>run.allocation[i][j]>=n)){run.available=add(run.available,run.allocation[i]);run.allocation[i]=run.allocation[i].map(()=>0);run.done[i]=true;out.detail+=' · P'+i+' released'}run.results.push(out);return out}
function reset(){const d=scenarios[scenarioIndex];state={data:d,step:0,banker:run('banker',d),detect:run('detect',d),current:null,motion:1,events:[]};$('steps').textContent=`0 / ${d.requests.length}`;updateButton()}
function advance(){if(state.step>=state.data.requests.length){playing=false;updateButton();return}const req=state.data.requests[state.step],results=[take(state.banker,req,state.step),take(state.detect,req,state.step)];state.current={req,results};state.events.unshift({step:state.step+1,req,results});state.step++;state.motion=0;$('steps').textContent=`${state.step} / ${state.data.requests.length}`;if(state.step===state.data.requests.length){playing=false;updateButton()}}
function updateButton(){$('play').textContent=playing?'❚❚ Pause':'▶ Play'}
function rr(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function text(s,x,y,size,color,weight='400',align='left'){ctx.font=`${weight} ${size}px Inter,system-ui,sans-serif`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function line(x1,y1,x2,y2,color,width=1,dash=[]){ctx.beginPath();ctx.setLineDash(dash);ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();ctx.setLineDash([])}
function color(result){return result.status==='dead'||result.status==='held'?C.red:result.status==='waiting'?C.amber:C.green}
function progress(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
function drawBg(){const g=ctx.createLinearGradient(0,0,1100,600);g.addColorStop(0,'#0d294b');g.addColorStop(1,'#08162c');ctx.fillStyle=g;ctx.fillRect(0,0,1100,600);for(let x=0;x<1100;x+=36)line(x,0,x,600,'#80b6e00b');for(let y=0;y<600;y+=36)line(0,y,1100,y,'#80b6e00b')}
function badge(label,x,y,w,c){rr(x,y,w,22,11,c+'1d',c);text(label,x+w/2,y+11,10,c,'800','center')}
function drawQueue(){const d=state.data,x=28,y=112,w=190;rr(x,y,w,362,16,'#0c2341',C.line);text('REQUEST QUEUE',x+18,y+22,12,C.cyan,'800');text('each packet moves to both tests',x+18,y+42,10,C.muted);d.requests.forEach((req,i)=>{const yy=y+64+i*54,active=i===state.step-1,upcoming=i===state.step;rr(x+16,yy,w-32,40,10,active?'#183a5c':upcoming?'#132e50':'#0a1a31',active?C.cyan:C.line);text('P'+req.pid,x+29,yy+14,11,active?C.cyan:C.text,'800');text(req.vec.join(' · '),x+29,yy+28,12,C.amber,'700');if(active)badge('NOW',x+w-65,yy+9,42,C.cyan);else if(i<state.step)text('✓',x+w-27,yy+20,14,C.green,'800','center')})}
function drawBank(){const d=state.data,vals=state.banker.available,x=260,y=112,w=520;rr(x,y,w,362,16,'#0c2341',C.line);text('RESOURCE BANK',x+20,y+22,12,C.cyan,'800');text('available work',x+20,y+42,10,C.muted);const m=vals.length,total=d.available.map((_,j)=>d.available[j]+d.allocation.reduce((n,row)=>n+row[j],0)),gap=12,bw=(w-58-(m-1)*gap)/m;for(let j=0;j<m;j++){const bx=x+20+j*(bw+gap),by=y+69,bh=128,ratio=total[j]?vals[j]/total[j]:0;rr(bx,by,bw,bh,10,'#08182f',C.line);const fillH=Math.max(3,(bh-2)*ratio);rr(bx+2,by+bh-fillH-2,bw-4,fillH,8,C.blue);text('R'+j,bx+bw/2,by+18,10,C.muted,'800','center');text(String(vals[j]),bx+bw/2,by+bh-25,22,C.text,'800','center');text('available',bx+bw/2,by+bh-8,9,C.muted,'400','center')}
  const cx=x+w/2,cy=y+256,active=state.current;ctx.beginPath();ctx.arc(cx,cy,42+Math.sin(clock/260)*3,0,Math.PI*2);ctx.fillStyle='#123a5d';ctx.fill();ctx.strokeStyle=active?C.cyan:C.line;ctx.lineWidth=2;ctx.stroke();ctx.beginPath();ctx.arc(cx,cy,28,0,Math.PI*2);ctx.strokeStyle=C.cyan;ctx.lineWidth=2;ctx.stroke();text('WORK',cx,cy-4,10,C.muted,'800','center');text(vals.join(' · '),cx,cy+13,15,C.text,'800','center');
  const left=state.current?.results[0],right=state.current?.results[1],phase=state.motion<1?progress(state.motion):0;if(active&&state.motion<1){const fromX=x-10,toX=cx,px=fromX+(toX-fromX)*phase;ctx.beginPath();ctx.arc(px,cy,7+Math.sin(clock/70)*2,0,Math.PI*2);ctx.fillStyle=C.amber;ctx.shadowColor=C.amber;ctx.shadowBlur=18;ctx.fill();ctx.shadowBlur=0;line(fromX,cy,toX,cy,C.amber,2,[7,7])}
  line(cx,cy+45,x+145,y+362-50,C.cyan,1,[4,7]);line(cx,cy+45,x+375,y+362-50,C.amber,1,[4,7]);[left,right].forEach((r,i)=>{if(!r)return;const tx=x+(i?370:140),ty=y+362-50;ctx.beginPath();ctx.arc(tx,ty,14+Math.sin(clock/100+i)*2,0,Math.PI*2);ctx.fillStyle=color(r)+'28';ctx.fill();ctx.strokeStyle=color(r);ctx.stroke()})}
function drawDecision(x,y,w,label,run,result,accent){rr(x,y,w,151,16,'#0c2341',C.line);text(label,x+18,y+24,12,accent,'800');text(run.kind==='banker'?'checks before grant':'grants then scans',x+18,y+44,10,C.muted);const status=result?result.title:'READY',c=result?color(result):C.muted;badge(status,x+18,y+61,Math.max(66,status.length*8+22),c);if(result){text(`P${result.pid} asks ${result.req.join(' · ')}`,x+18,y+102,12,C.text,'700');text(result.detail,x+18,y+124,10,c)}else text('waiting for the next packet',x+18,y+105,11,C.muted)}
function drawEvents(){const x=28,y=500,w=1044;rr(x,y,w,70,14,'#0c2341',C.line);text('LATEST DECISION',x+18,y+19,10,C.muted,'800');const e=state.events[0];if(!e){text('Press Play or Step — the next request will animate across the stage.',x+18,y+45,13,C.text,'500');return}const a=e.results[0],b=e.results[1];text(`P${a.pid}  requested  ${e.req.vec.join(' · ')}`,x+18,y+43,13,C.text,'700');text('BANKER',x+420,y+26,9,C.muted,'800');text(a.title,x+420,y+47,13,color(a),'800');text('DETECTOR',x+590,y+26,9,C.muted,'800');text(b.title,x+590,y+47,13,color(b),'800');text(`step ${e.step}`,x+w-18,y+36,11,C.muted,'700','right')}
function draw(){drawBg();text(state.data.name,28,30,23,C.text,'800');text('One request · two decisions',28,56,11,C.muted);badge(playing?'RUNNING':'PAUSED',936,20,112,playing?C.green:C.muted);drawQueue();drawBank();const e=state.current?.results;drawDecision(798,112,274,"BANKER'S AVOIDANCE",state.banker,e?.[0],C.cyan);drawDecision(798,278,274,'DEADLOCK DETECTION',state.detect,e?.[1],C.amber);drawEvents();state.motion=Math.min(1,state.motion+.009);}
function loop(t){if(!last)last=t;const raw=t-last,dt=raw<2?raw*1000:Math.min(60,raw);last=t;clock+=dt;if(playing){carry+=dt*speed;if(carry>1450){carry=0;advance()}}draw();requestAnimationFrame(loop)}
$('scenario').addEventListener('change',e=>{scenarioIndex=+e.target.value;reset()});$('play').addEventListener('click',()=>{if(state.step>=state.data.requests.length)reset();playing=!playing;updateButton()});$('step').addEventListener('click',()=>{playing=false;updateButton();advance()});$('reset').addEventListener('click',()=>{playing=false;reset()});$('speed').addEventListener('input',e=>{speed=+e.target.value;$('speedText').textContent=speed+'×'});reset();requestAnimationFrame(loop);
</script>
</body>
</html>
